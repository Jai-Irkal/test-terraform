
name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform Validation and Plan
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      TF_VAR_environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      
      - name: Debug OIDC Claims
        shell: bash
        run: |
          node <<'NODE'
          async function main() {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL
              + "&audience=sts.amazonaws.com";

            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`
              }
            });

            if (!response.ok) {
              throw new Error(`OIDC request failed: ${response.status}`);
            }

            const result = await response.json();
            const claims = JSON.parse(
              Buffer.from(result.value.split('.')[1], 'base64url').toString()
            );

            console.log(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              ref: claims.ref,
              environment: claims.environment
            }, null, 2));
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::422169036124:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false